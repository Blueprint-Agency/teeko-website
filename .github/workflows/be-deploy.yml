name: BE Deploy

on:
  push:
    branches: [main, staging]
    paths:
      - 'be/**'
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    # Replaces the action's implicit command_timeout (10m default). Plain ssh
    # has no such guard and the job default is 6h.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push BE image
        uses: docker/build-push-action@v5
        with:
          context: ./be
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-be:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
            ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-be:${{ github.ref_name == 'main' && 'latest' || 'staging' }}-${{ github.sha }}

      # Reach the VPS over the tailnet rather than its public IP, so port 22 can be
      # closed at the firewall. Same pattern teeko-ehailing and kaiteki-web already use.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ github.ref_name == 'main' && vars.VPS2_TAILSCALE_HOST || vars.VPS1_TAILSCALE_HOST }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      # Plain ssh, not appleboy/ssh-action. That action ships no SSH code -- it
      # curls the drone-ssh binary from GitHub release assets on every run, and
      # its cache branch never hits on an ephemeral runner. booking-system lost
      # a deploy to that download on 2026-08-12, before it reached the host.
      # ssh is already here. Same pattern as infra's deploy-infra.yml.
      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=90 \
            "deploy@${{ github.ref_name == 'main' && vars.VPS2_TAILSCALE_HOST || vars.VPS1_TAILSCALE_HOST }}" \
            'umask 077; f=$(mktemp); cat > "$f" && bash "$f"; rc=$?; rm -f "$f"; exit $rc' <<'REMOTE'
            {
              echo "PORT=${{ vars.PORT }}"
              echo "DB_HOST=${{ vars.DB_HOST }}"
              echo "DB_PORT=${{ vars.DB_PORT }}"
              echo "DB_USER=${{ vars.DB_USER }}"
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
              echo "DB_NAME=${{ vars.DB_NAME }}"
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
              echo "FRONTEND_URL=${{ vars.FRONTEND_URL }}"
              echo "SUPERADMIN_USERNAME=${{ vars.SUPERADMIN_USERNAME }}"
              echo "SUPERADMIN_PASSWORD=${{ secrets.SUPERADMIN_PASSWORD }}"
              echo "SERPAPI_API_KEY=${{ secrets.SERPAPI_API_KEY }}"
              echo "SMTP_SERVICE=${{ vars.SMTP_SERVICE }}"
              echo "SMTP_HOST=${{ vars.SMTP_HOST }}"
              echo "SMTP_PORT=${{ vars.SMTP_PORT }}"
              echo "SMTP_USER=${{ vars.SMTP_USER }}"
              echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
              echo "R2_S3_API=${{ vars.R2_S3_API }}"
              echo "R2_ACCESS_KEY_ID=${{ vars.R2_ACCESS_KEY_ID }}"
              echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
              echo "R2_BUCKET_NAME=${{ vars.R2_BUCKET_NAME }}"
              echo "R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}"
            } > /root/stacks/website/.env.site-be
            {
              echo "POSTGRES_USER=${{ vars.DB_USER }}"
              echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}"
              echo "POSTGRES_DB=${{ vars.DB_NAME }}"
            } > /root/stacks/website/.env.site-db
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-be:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
            cd /root/stacks/website
            docker compose up -d --no-deps backend-site
            docker image prune -f
          REMOTE
