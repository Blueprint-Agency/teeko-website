name: FE Deploy

on:
  push:
    branches: [main, staging]
    paths:
      - 'fe/**'
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push FE image
        uses: docker/build-push-action@v5
        with:
          context: ./fe
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-fe:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
            ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-fe:${{ github.ref_name == 'main' && 'latest' || 'staging' }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_AI_APP_URL=${{ vars.NEXT_PUBLIC_AI_APP_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            BACKEND_URL=${{ vars.BACKEND_URL }}

      # Reach the VPS over the tailnet rather than its public IP, so port 22 can be
      # closed at the firewall. Same pattern teeko-ehailing and kaiteki-web already use.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ github.ref_name == 'main' && vars.VPS2_TAILSCALE_HOST || vars.VPS1_TAILSCALE_HOST }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'main' && vars.VPS2_TAILSCALE_HOST || vars.VPS1_TAILSCALE_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            {
              echo "BACKEND_URL=http://backend-site:3000"
            } > /root/stacks/website/.env.site-fe
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-fe:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
            cd /root/stacks/website
            docker compose up -d --no-deps site-fe
            docker image prune -f
