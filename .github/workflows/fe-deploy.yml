name: FE Deploy

on:
  push:
    branches: [main, staging]
    paths:
      - 'fe/**'
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    # Replaces the action's implicit command_timeout (10m default). Plain ssh
    # has no such guard and the job default is 6h.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push FE image
        uses: docker/build-push-action@v5
        with:
          context: ./fe
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-fe:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
            ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-fe:${{ github.ref_name == 'main' && 'latest' || 'staging' }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_AI_APP_URL=${{ vars.NEXT_PUBLIC_AI_APP_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            BACKEND_URL=${{ vars.BACKEND_URL }}

      # Reach the VPS over the tailnet rather than its public IP, so port 22 can be
      # closed at the firewall. Same pattern teeko-ehailing and kaiteki-web already use.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ github.ref_name == 'main' && vars.VPS2_TAILSCALE_HOST || vars.VPS1_TAILSCALE_HOST }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      # Plain ssh, not appleboy/ssh-action. That action ships no SSH code -- it
      # curls the drone-ssh binary from GitHub release assets on every run, and
      # its cache branch never hits on an ephemeral runner. booking-system lost
      # a deploy to that download on 2026-08-12, before it reached the host.
      # ssh is already here. Same pattern as infra's deploy-infra.yml.
      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=90 \
            "deploy@${{ github.ref_name == 'main' && vars.VPS2_TAILSCALE_HOST || vars.VPS1_TAILSCALE_HOST }}" \
            'umask 077; f=$(mktemp); cat > "$f" && bash "$f"; rc=$?; rm -f "$f"; exit $rc' <<'REMOTE'
            {
              echo "BACKEND_URL=http://backend-site:3000"
            } > /root/stacks/website/.env.site-fe
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-fe:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
            cd /root/stacks/website
            docker compose up -d --no-deps site-fe
            docker image prune -f
          REMOTE
