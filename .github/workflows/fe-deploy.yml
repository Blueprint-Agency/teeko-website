name: FE Deploy

on:
  push:
    branches: [main, staging]
    paths:
      - 'fe/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push FE image
        uses: docker/build-push-action@v5
        with:
          context: ./fe
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-fe:${{ steps.vars.outputs.tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-fe:${{ steps.vars.outputs.tag }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_AI_APP_URL=${{ vars.NEXT_PUBLIC_AI_APP_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            BACKEND_URL=${{ vars.BACKEND_URL }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'main' && vars.VPS2_HOST || vars.VPS1_HOST }}
          username: root
          password: ${{ github.ref_name == 'main' && secrets.VPS2_SSH_PASSWORD || secrets.VPS1_SSH_PASSWORD }}
          script: |
            {
              echo "BACKEND_URL=http://backend-site:3000"
            } > /root/stacks/website/.env.site-fe
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/teeko-website-fe:${{ steps.vars.outputs.tag }}
            cd /root/stacks/website
            docker compose up -d --no-deps site-fe
            docker image prune -f
