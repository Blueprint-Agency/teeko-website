services:
  db:
    image: postgres:16-alpine
    container_name: teeko-db
    environment:
      POSTGRES_USER: teeko
      POSTGRES_PASSWORD: teeko_dev_pass
      POSTGRES_DB: teeko
    ports:
      - "5433:5432"
    volumes:
      - teeko-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U teeko -d teeko -c 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teeko-db-data:
