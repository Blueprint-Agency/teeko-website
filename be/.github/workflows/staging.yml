name: Staging BE CI/CD

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/teeko-site-be:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/teeko-site-be:staging-${{ github.sha }}

      - name: Update Staging Infra (BE)
        run: |
          git config --global user.email "bot@teeko.ai"
          git config --global user.name "Teeko Deployment Bot"
          git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/teeko-staging-infra.git
          cd teeko-staging-infra
          git checkout staging
          echo "Deploying Backend - $(date)" > last_be_deploy.txt
          git add last_be_deploy.txt
          git commit -m "🚀 Auto-deploy BE: ${{ github.sha }}"
          git push origin staging

      - name: Trigger Portainer Deployment
        run: |
          curl -X POST "${{ secrets.PORTAINER_STAGING_WEBHOOK_URL }}"
